<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px #0001;
        }

        h2 {
            text-align: center;
            color: #1e293b;
        }

        label {
            display: block;
            margin: 15px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            background: #059669;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #2563eb;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Teacher Registration</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Teacher Name</label>
        <input type="text" name="name" maxlength="15">

        <label>Email</label>
        <input type="email" name="email">

        <label>Teacher Image</label>
        <input type="file" name="image" accept="image/*">

        <button type="submit">Register Teacher</button>
    </form>

    <a href="/">Back to Home</a>
</div>

</body>
</html>
