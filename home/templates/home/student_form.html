
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        h2 { text-align: center; margin-bottom: 25px; color: #1e293b; }

        label { display: block; margin-bottom: 8px; color: #334155; font-weight: bold; }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Registration</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Student Name</label>
        <input type="text" name="name" maxlength="15" placeholder="Enter student name">

        <label>Email</label>
        <input type="email" name="email" maxlength="30" placeholder="Enter email">

        <label>Roll Number</label>
        <input type="number" name="roll" placeholder="Enter roll">

        <label>Registration Number</label>
        <input type="number" name="registration" placeholder="Enter registration">

        <label>Student Image</label>
        <input type="file" name="image" accept="image/*">

        <button type="submit">Register Student</button>
    </form>

    <a href="/" class="back">← Back to Home</a>

</div>

</body>
</html>
