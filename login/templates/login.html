<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login or Sign up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#dbf0ff; --ink:#fff; --muted:#b9c6e4; --field:#f8fafc; --field-ink:#1b2440;
  --blue:#1240ff; --blue-hover:#2d55ff; --cyan:#00e5e0; --line:rgba(255,255,255,.35);
  --err:#ff8a8a; --ok:#4de0a4;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{--page:#0b1a2c}}
:root:not([data-theme="light"]){}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--page);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
.card{width:100%;max-width:1120px;min-height:640px;display:grid;grid-template-columns:1fr 1fr;border-radius:36px;overflow:hidden;
  background:#0a1030;box-shadow:0 0 0 6px rgba(255,255,255,.7),0 30px 80px rgba(10,30,80,.35)}
.panel{position:relative;padding:56px 50px;display:flex;flex-direction:column;justify-content:center;
  background:
    radial-gradient(420px 360px at 38% 24%,rgba(0,229,224,.75),transparent 70%),
    radial-gradient(520px 420px at 100% 88%,rgba(10,80,255,.85),transparent 70%),
    radial-gradient(400px 300px at 0% 95%,rgba(60,30,120,.55),transparent 70%),
    #0a0e2a}
h1{font-size:44px;line-height:1.1;margin:0 0 16px;font-weight:700;letter-spacing:-.02em}
.swap{margin:0 0 28px;font-size:16px}
.swap button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.swap button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:4px}
form{display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:16px;margin:0 0 8px 12px;font-weight:500}
.input{position:relative;display:flex;align-items:center;background:var(--field);border-radius:14px;border:2px solid transparent;transition:border-color .15s,box-shadow .15s}
.input:focus-within{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,229,224,.25)}
.input input{flex:1;min-width:0;height:52px;border:0;background:none;padding:0 16px;font:inherit;font-size:16px;color:var(--field-ink);outline:none;border-radius:14px}
.input input::placeholder{color:#6b7592}
.eye{all:unset;cursor:pointer;width:52px;height:30px;display:grid;place-items:center;border-left:1px solid #d6dbe8;color:#46557e}
.eye:focus-visible{outline:2px solid var(--blue);border-radius:6px}
.field.bad .input{border-color:var(--err)}
.msg{min-height:18px;margin:6px 0 0 12px;font-size:13px;color:var(--err)}
.meter{display:flex;gap:6px;margin:8px 12px 0}
.meter i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.2);transition:background .2s}
.hint{font-size:13px;color:var(--muted);margin:6px 12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;margin:-2px 4px 0 4px}
.row a{color:var(--ink);text-underline-offset:3px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);line-height:1.4}
.check input{margin-top:2px;width:18px;height:18px;accent-color:var(--blue)}
.check a{color:var(--ink)}
.primary{height:56px;border:0;border-radius:16px;background:var(--blue);color:#fff;font:inherit;font-size:18px;font-weight:600;cursor:pointer;margin-top:10px;transition:background .15s,transform .1s}
.primary:hover{background:var(--blue-hover)}
.primary:active{transform:scale(.99)}
.primary:focus-visible,.social:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.or{display:flex;align-items:center;gap:16px;margin:26px 0;font-size:13px;color:var(--ink)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.socials{display:flex;flex-direction:column;gap:16px}
.social{position:relative;height:54px;border-radius:16px;border:1px solid rgba(255,255,255,.7);background:transparent;color:#fff;font:inherit;font-size:17px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.social:hover{background:rgba(255,255,255,.1)}
.social svg{position:absolute;left:32px;width:28px;height:28px}
.status{margin-top:16px;font-size:14px;color:var(--ok);min-height:20px}
.art{position:relative;background:#050b1e;border-left:1px solid rgba(255,255,255,.2);overflow:hidden}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.signup-only{display:none}
.is-signup .signup-only{display:block}
.is-signup .signin-only{display:none}
.pulse{animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{opacity:.75}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 70s linear infinite}
.rev{transform-box:fill-box;transform-origin:center;animation:spin 45s linear infinite reverse}
.float circle{animation:drift 6s ease-in-out infinite}
.float circle:nth-child(2){animation-delay:-1.5s}.float circle:nth-child(3){animation-delay:-3s}.float circle:nth-child(4){animation-delay:-4.5s}
.cap{position:absolute;left:44px;right:44px;bottom:44px}
.cap h2{margin:0 0 8px;font-size:22px;font-weight:600;letter-spacing:-.01em}
.cap p{margin:0;font-size:15px;line-height:1.5;color:var(--muted);max-width:380px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{50%{transform:translate(14px,-18px);opacity:.3}}
@media (max-width:860px){
  .card{grid-template-columns:1fr;min-height:0;border-radius:28px}
  .cap{display:none}
  .art{height:220px;order:-1;border-left:0;border-bottom:1px solid rgba(255,255,255,.2)}
  .panel{padding:40px 24px}
  h1{font-size:36px}
}
@media (prefers-reduced-motion:reduce){.pulse,.spin,.rev,.float circle{animation:none}*{transition:none!important}}

.art svg{background:#050b1e}
.kb{transform-origin:870px 585px;animation:kb 26s ease-in-out infinite alternate}
.fx{mix-blend-mode:screen}
.breathe{transform-origin:870px 585px;animation:breathe 4.5s ease-in-out infinite}
.breathe.slow{transform-origin:40px 1560px;animation-duration:9s}
.ping{transform-origin:870px 585px;opacity:0;animation:ping 6.5s cubic-bezier(.2,.6,.3,1) infinite}
.ping.d2{animation-delay:-3.25s}
.sweep{transform:skewX(-18deg);animation:sweep 11s ease-in-out infinite}
.pt{opacity:0;animation:rise var(--d) ease-in-out var(--dl) infinite}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.06) translate(-14px,10px)}}
@keyframes breathe{0%,100%{opacity:.45;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
@keyframes ping{0%{opacity:.75;transform:scale(.55)}100%{opacity:0;transform:scale(3.6)}}
@keyframes sweep{0%{transform:translateX(0) skewX(-18deg)}60%,100%{transform:translateX(2400px) skewX(-18deg)}}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}25%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),-170px)}}
@media (prefers-reduced-motion:reduce){.kb,.breathe,.ping,.sweep,.pt{animation:none}.ping,.sweep{display:none}.pt{opacity:.6}}
</style>
</head>
<body>
<main class="card" id="card">
  <section class="panel">
    <h1 id="title">Login</h1>
    <p class="swap"><span id="swapText">Don’t have an account?</span> <button type="button" id="swapBtn">Sign up</button></p>

    <form id="form" novalidate>
      <div class="field signup-only" data-f="name">
        <label for="name">Full name</label>
        <div class="input"><input id="name" type="text" autocomplete="name" placeholder="Jane Cooper"></div>
        <div class="msg"></div>
      </div>
      <div class="field" data-f="email">
        <label for="email">Email</label>
        <div class="input"><input id="email" type="email" autocomplete="email" placeholder="example@gmail.com"></div>
        <div class="msg"></div>
      </div>
      <div class="field" data-f="password">
        <label for="password">Password</label>
        <div class="input">
          <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password">
          <button type="button" class="eye" data-target="password" aria-label="Show password">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg>
          </button>
        </div>
        <div class="meter signup-only" id="meter"><i></i><i></i><i></i><i></i></div>
        <div class="hint signup-only" id="hint">Use 8 or more characters with letters, numbers and a symbol.</div>
        <div class="msg"></div>
      </div>
      <div class="field signup-only" data-f="confirm">
        <label for="confirm">Confirm password</label>
        <div class="input">
          <input id="confirm" type="password" autocomplete="new-password" placeholder="Re-enter your password">
          <button type="button" class="eye" data-target="confirm" aria-label="Show password">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg>
          </button>
        </div>
        <div class="msg"></div>
      </div>

      <div class="row signin-only">
        <label class="check" style="align-items:center"><input type="checkbox" id="remember"> Remember me</label>
        <a href="#forgot">Forgot password?</a>
      </div>
      <div class="signup-only" data-f="terms">
        <label class="check"><input type="checkbox" id="terms"> <span>I agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>.</span></label>
        <div class="msg"></div>
      </div>

      <button class="primary" type="submit" id="submit">Login</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>

    <div class="or">OR</div>
    <div class="socials">
      <button type="button" class="social">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.500 42.600 14.600 48 24 48z"/></svg>
        <span class="socialLabel">Login with Google</span>
      </button>
      <button type="button" class="social">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="6" fill="#1877F2"/><path fill="#fff" d="M33 48V30h6l1-7h-7v-4.500c0-2 .6-3.400 3.500-3.400H40V8.800C39.400 8.700 37.300 8.500 34.800 8.500 29.600 8.500 26 11.700 26 17.500V23h-6v7h6v18z"/></svg>
        <span class="socialLabel">Login with Facebook</span>
      </button>
    </div>
  </section>

  <aside class="art" aria-hidden="true">
    <svg viewBox="0 0 1550 1808" preserveAspectRatio="xMidYMin slice">
      <defs>
        <radialGradient id="gS"><stop offset="0" stop-color="#4ff3ff" stop-opacity=".65"/><stop offset=".45" stop-color="#1fb6ff" stop-opacity=".25"/><stop offset="1" stop-color="#1fb6ff" stop-opacity="0"/></radialGradient>
        <radialGradient id="gB"><stop offset="0" stop-color="#1c5cff" stop-opacity=".8"/><stop offset="1" stop-color="#1c5cff" stop-opacity="0"/></radialGradient>
        <linearGradient id="gW" x1="0" x2="1"><stop offset="0" stop-color="#8fe9ff" stop-opacity="0"/><stop offset=".5" stop-color="#8fe9ff" stop-opacity=".16"/><stop offset="1" stop-color="#8fe9ff" stop-opacity="0"/></linearGradient>
      </defs>

<script>
(function(){
  var card=document.getElementById('card'), form=document.getElementById('form');
  var title=document.getElementById('title'), swapText=document.getElementById('swapText'), swapBtn=document.getElementById('swapBtn');
  var submit=document.getElementById('submit'), status=document.getElementById('status'), pw=document.getElementById('password');
  var labels=document.querySelectorAll('.socialLabel');
  var signup=false;

  function setMode(s){
    signup=s; card.classList.toggle('is-signup',s);
    title.textContent=s?'Sign up':'Login';
    swapText.textContent=s?'Already have an account?':'Don’t have an account?';
    swapBtn.textContent=s?'Login':'Sign up';
    submit.textContent=s?'Sign up':'Login';
    pw.autocomplete=s?'new-password':'current-password';
    pw.placeholder=s?'Create a password':'Enter your password';
    labels[0].textContent=(s?'Sign up':'Login')+' with Google';
    labels[1].textContent=(s?'Sign up':'Login')+' with Facebook';
    clearAll(); status.textContent='';
  }
  swapBtn.addEventListener('click',function(){setMode(!signup)});

  document.querySelectorAll('.eye').forEach(function(b){
    b.addEventListener('click',function(){
      var i=document.getElementById(b.dataset.target), show=i.type==='password';
      i.type=show?'text':'password';
      b.setAttribute('aria-label',show?'Hide password':'Show password');
      b.style.color=show?'#1240ff':'';
    });
  });

  function score(v){
    var s=0; if(v.length>=8)s++; if(/[a-z]/.test(v)&&/[A-Z]/.test(v))s++; if(/\d/.test(v))s++; if(/[^A-Za-z0-9]/.test(v))s++; return s;
  }
  var bars=document.querySelectorAll('#meter i'), colors=['#ff6b6b','#ffb347','#e6e85a','#4de0a4'];
  pw.addEventListener('input',function(){
    var s=score(pw.value);
    bars.forEach(function(b,i){b.style.background=i<s?colors[s-1]:''});
  });

  function setErr(key,msg){
    var f=document.querySelector('[data-f="'+key+'"]'); if(!f)return;
    f.classList.toggle('bad',!!msg); f.querySelector('.msg').textContent=msg||'';
  }
  function clearAll(){['name','email','password','confirm','terms'].forEach(function(k){setErr(k,'')})}

  function validate(){
    clearAll(); var ok=true;
    var email=document.getElementById('email').value.trim(), p=pw.value;
    if(signup && document.getElementById('name').value.trim().length<2){setErr('name','Enter your full name.');ok=false}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){setErr('email','Enter a valid email address, like name@example.com.');ok=false}
    if(!p){setErr('password','Enter your password.');ok=false}
    else if(signup && score(p)<3){setErr('password','Password is too weak. Add more characters, numbers or a symbol.');ok=false}
    if(signup){
      if(document.getElementById('confirm').value!==p){setErr('confirm','Passwords don’t match.');ok=false}
      if(!document.getElementById('terms').checked){setErr('terms','Accept the terms to create your account.');ok=false}
    }
    return ok;
  }

  form.addEventListener('submit',function(e){
    e.preventDefault(); status.textContent='';
    if(!validate())return;
    submit.disabled=true; var t=submit.textContent; submit.textContent='Please wait…';
    // Replace this timeout with your real API request.
    setTimeout(function(){
      submit.disabled=false; submit.textContent=t;
      status.textContent=signup?'Account created. Check your email to verify it.':'Logged in successfully.';
    },900);
  });
})();
</script>
<script>
(function(){
  var g=document.getElementById('pts'),ns='http://www.w3.org/2000/svg';
  for(var i=0;i<44;i++){
    var c=document.createElementNS(ns,'circle');
    c.setAttribute('class','pt');
    c.setAttribute('cx',Math.round(40+Math.random()*1470));
    c.setAttribute('cy',Math.round(200+Math.random()*1560));
    c.setAttribute('r',(2+Math.random()*5).toFixed(1));
    c.setAttribute('fill',Math.random()<.7?'#8ff6ff':'#ffffff');
    c.setAttribute('style','--d:'+(6+Math.random()*7).toFixed(1)+'s;--dl:-'+(Math.random()*12).toFixed(1)+'s;--dx:'+Math.round(-50+Math.random()*100)+'px');
    g.appendChild(c);
  }
})();
</script>
